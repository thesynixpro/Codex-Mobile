name: Build APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java Version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Fix for missing debug.keystore in repository root path
      - name: Create Debug Keystore in Expected Locations
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cp ~/.android/debug.keystore ./debug.keystore

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Zip APK File
        run: |
          zip -j app/build/outputs/apk/debug/app-debug.zip app/build/outputs/apk/debug/app-debug.apk

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-zip
          path: app/build/outputs/apk/debug/app-debug.zip
          if-no-files-found: error

      - name: Create Release Tag
        id: release_tag
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}-${{ github.run_attempt }}"
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.release_tag.outputs.TAG_NAME }}
          files: app/build/outputs/apk/debug/app-debug.zip
          make_latest: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
