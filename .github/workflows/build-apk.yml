name: Build debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify active Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Set up Gradle 9.3.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          /tmp/gradle-9.3.1/bin/gradle --version

      - name: Create temporary debug keystore
        run: |
          keytool -genkeypair -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"
          ls -lh ./debug.keystore

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release with debug APK
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          NOTES="This is an automatically generated debug APK.

          The APK was built by GitHub Actions.

          GitHub Actions run number: ${{ github.run_number }}

          GitHub Actions run attempt: ${{ github.run_attempt }}

          Source commit SHA: ${{ github.sha }}

          The APK is intended for testing.

          The APK is not a Play Store production release.

          The APK is signed only with a temporary debug keystore."
          gh release create "$TAG" "app/build/outputs/apk/debug/app-debug.apk" --target "${{ github.sha }}" --title "$TAG" --notes "$NOTES" --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "Release publishing succeeded."
            gh release view "$TAG"
            TITLE=$(gh release view "$TAG" --json name -q .name)
            URL=$(gh release view "$TAG" --json url -q .url)
            echo "Release tag: $TAG"
            echo "Release title: $TITLE"
            echo "Release URL: $URL"
            echo "APK asset filename: app-debug.apk"
            {
              echo "## Debug APK release published"
              echo ""
              echo "Release tag: $TAG"
              echo "Release title: $TITLE"
              echo "Release page: $URL"
              echo ""
              echo "The APK can be downloaded from the release Assets section."
              echo "The normal Actions artifact is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Release publishing failed, but the APK build succeeded. The Actions artifact named app-debug-apk remains available."
            echo "APK build succeeded."
            echo "Actions artifact named app-debug-apk remains available."
            {
              echo "## Debug APK build succeeded, release publishing failed"
              echo ""
              echo "::warning::Release publishing failed, but the APK build succeeded."
              echo ""
              echo "The APK build succeeded."
              echo "The Actions artifact named app-debug-apk remains available as a backup."
              echo "Download it from the Actions run artifacts section."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
